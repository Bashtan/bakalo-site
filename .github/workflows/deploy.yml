name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          DB_ID=$(wrangler d1 list 2>&1 | grep "bakalo-db" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          if [ -z "$DB_ID" ]; then
            echo "Creating D1 database..."
            CREATE_OUT=$(wrangler d1 create bakalo-db 2>&1)
            DB_ID=$(echo "$CREATE_OUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          fi
          echo "database_id = $DB_ID"
          sed -i "s|database_id = \".*\"|database_id = \"$DB_ID\"|" wrangler.toml
          wrangler d1 migrations apply bakalo-db --remote

      - name: Seed D1 (skip if already seeded)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          COUNT=$(wrangler d1 execute bakalo-db --remote --command="SELECT COUNT(*) as n FROM articles" 2>&1 | grep -oE '[0-9]+' | tail -1)
          if [ "$COUNT" = "0" ] || [ -z "$COUNT" ]; then
            echo "Seeding database..."
            wrangler d1 execute bakalo-db --remote --file=seed.sql
          else
            echo "Already seeded ($COUNT articles) — skipping"
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          BRANCH=${GITHUB_REF_NAME}
          wrangler pages deploy . \
            --project-name bakalo-capital \
            --branch "$BRANCH" \
            --commit-message "ci: deploy $BRANCH @ ${{ github.sha }}"
