name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "── Listing existing D1 databases..."
          wrangler d1 list 2>&1 || true

          DB_ID=$(wrangler d1 list 2>&1 | grep "bakalo-db" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)

          if [ -z "$DB_ID" ]; then
            echo "── Creating D1 database..."
            CREATE_OUT=$(wrangler d1 create bakalo-db 2>&1 || true)
            echo "$CREATE_OUT"
            DB_ID=$(echo "$CREATE_OUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          fi

          if [ -z "$DB_ID" ]; then
            echo "❌ Could not get or create database_id. Check token has D1:Edit permission."
            exit 1
          fi

          echo "── database_id = $DB_ID"
          sed -i "s|database_id = \".*\"|database_id = \"$DB_ID\"|" wrangler.toml
          wrangler d1 migrations apply bakalo-db --remote

      - name: Seed D1 (skip if already seeded)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          COUNT=$(wrangler d1 execute bakalo-db --remote --command="SELECT COUNT(*) as n FROM articles" --json 2>&1 | python3 -c "import sys,json; data=json.load(sys.stdin); print(data[0]['results'][0]['n'])" 2>/dev/null || echo "0")
          if [ "$COUNT" = "0" ]; then
            echo "Seeding database..."
            wrangler d1 execute bakalo-db --remote --file=seed.sql
          else
            echo "Already seeded ($COUNT articles) — skipping"
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          BRANCH=${GITHUB_REF_NAME}
          wrangler pages deploy . \
            --project-name bakalo-capital \
            --branch "$BRANCH" \
            --commit-message "ci: deploy $BRANCH @ ${{ github.sha }}"
